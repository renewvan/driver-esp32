# One relay channel. Included once per channel from esp32-relay-driver.yaml:
#   relay_01: !include { file: pkg/relay-channel.yaml, vars: { ch: relay_01, bit: 0 } }
# vars: ch = the channel id on the bus (renewvan/relay/<ch>/...), bit = shift-register output 0..15.
#
# This file holds only what is per channel and can be merged by id: the switch, the restoring
# name, and the two subscriptions. It deliberately holds NO on_connect entry: the order of
# separate on_connect entries is undefined, so the sixteen states are published from the one
# connect chain in esp32-relay-driver.yaml (states, then info, then online).

globals:
  # Retained label, restored across reboot and OTA. 63 bytes by default; the rename handler
  # below enforces the bound itself because an oversize string in a `globals` entry is
  # silently NOT saved and would revert at the next reboot.
  - id: name_${ch}
    type: std::string
    restore_value: true
    initial_value: '""'

switch:
  - platform: gpio
    id: relay_${ch}
    name: "${ch} relay"
    pin: { sn74hc595: hc595, number: "${bit}" }
    # Every channel is off after ANY reset, brownout, update or crash. No state is restored,
    # so a stale "restore last state" can never switch a load back on.
    restore_mode: ALWAYS_OFF
    internal: true
    on_state:
      # State is published only after the physical output changed (it is the device's truth,
      # not an echo of a command).
      - mqtt.publish:
          topic: renewvan/relay/${ch}/state
          payload: !lambda 'return x ? "true" : "false";'
          retain: true

mqtt:
  on_message:
    # Command: unretained JSON true / false only. No payload filter, so this is one
    # subscription per topic, not one per payload.
    - topic: renewvan/relay/${ch}/set
      then:
        - lambda: |-
            if (x == "true") {
              id(relay_${ch}).turn_on();
            } else if (x == "false") {
              id(relay_${ch}).turn_off();
            } else {
              ESP_LOGW("relay", "${ch}: set is not JSON true/false, ignored");
            }
    # Rename: a JSON string on a fixed topic. The trigger hands the action only the raw
    # payload (quotes included), so it is decoded here. on_json_message would lose the value.
    - topic: renewvan/relay/${ch}/name/set
      then:
        - lambda: |-
            JsonDocument doc;
            if (deserializeJson(doc, x) != DeserializationError::Ok || !doc.is<const char *>()) {
              ESP_LOGW("relay", "${ch}: name/set is not a JSON string, ignored");
              return;
            }
            std::string v = doc.as<std::string>();
            if (v.empty() || v.size() > 63) {
              ESP_LOGW("relay", "${ch}: name rejected (empty or over 63 bytes)");
              return;
            }
            id(name_${ch}) = v;
            JsonDocument out;
            out.set(v);
            std::string payload;
            serializeJson(out, payload);
            id(mqtt_client).publish("renewvan/relay/${ch}/name", payload, 0, true);
