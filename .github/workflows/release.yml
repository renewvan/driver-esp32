name: Release
run-name: Release ${{ inputs.version && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || format('{0} bump', inputs.bump) }}${{ inputs.prerelease && ' (pre-release)' || '' }}

# Start a release from the Actions tab or `gh workflow run release.yml -f bump=minor`.
# The process lives in renewvan/hub (docs/adr/0015); this file only says what this repo ships.
# One tag stamps the same version into EVERY variant under manifests/: the reusable workflow
# builds each one listed by `python3 scripts/variants.py list` (firmware/<variant>.yaml +
# manifests/<variant>.json). The pinned hub ref must have that variant matrix and the placeholder --board (hub#165).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest release's version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version (e.g. 0.2.0 or 0.2.0-beta.1); overrides "bump"'
        type: string
        required: false
      prerelease:
        description: "Pre-release (a beta from a feature branch): tests gate it, `main` and `:latest` stay untouched"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      # Not used by kind: firmware, but GitHub validates the whole called workflow up front and
      # its publish-image job requests packages: write; a caller that grants less fails to start.
      packages: write
    uses: renewvan/hub/.github/workflows/release.yml@50d4ad5dc07d0a88741097cb0f87f9bc25ac9e6d
    with:
      kind: firmware
      esphome-version: "2026.9.1"
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
