name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned: the action defaults to `latest`, which would change under us.
  ESPHOME_VERSION: "2026.9.1"
  # Nothing built here is flashed, so there is no real board: a fixed valid name (a slug, not
  # ending in -<digits>, see scripts/variants.py) stands in. Drop it from a build and the
  # resolved-config guard fails on the unexpanded `${board}`.
  CI_BOARD: ci-board

jobs:
  scripts:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests for the build scripts
        run: python3 -m unittest discover -s tests -v

      # Every manifests/<variant>.json has its firmware/<variant>.yaml, none carries a `driver`, and every firmware has its manifest.
      - name: Guard the variant layout
        run: python3 scripts/variants.py check

      # The matrix is the directory: adding a variant adds a job, nothing here changes.
      - name: List the variants
        id: list
        run: echo "variants=$(python3 scripts/variants.py list)" >> "$GITHUB_OUTPUT"

  validate:
    needs: scripts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.scripts.outputs.variants) }}
    steps:
      - uses: actions/checkout@v5

      # Only the relay variants have a channel list; a variant without one has nothing to compare.
      - name: Guard the relay channel list
        if: matrix.variant == 'esp32-16x-relay' || matrix.variant == 'esp32-8x-relay'
        run: python3 scripts/check_relay_channels.py "${{ matrix.variant }}"

      - name: Fake secrets for config validation
        run: cp secrets.yaml.example secrets.yaml

      # The CI version is deliberately not a real release: nothing built here is flashed.
      - name: Compose the CI version and the manifest substitutions
        id: stamp
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          version="ci-${GITHUB_SHA::7}"
          {
            echo "version=${version}"
            echo "substitutions<<EOF"
            echo "version=${version}"
            python3 scripts/manifest_substitutions.py "${VARIANT}" --board "${CI_BOARD}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned by commit SHA (v8.1.0). v6 had no `substitutions` input.
      - name: Build
        id: build
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: firmware/${{ matrix.variant }}.yaml
          version: ${{ env.ESPHOME_VERSION }}
          substitutions: ${{ steps.stamp.outputs.substitutions }}

      # `esphome config` only warns on an undeclared substitution and exits 0, leaving the
      # literal placeholder in the configuration, so the build alone cannot catch a dropped
      # stamp. Resolve the same configuration and fail on it.
      - name: Resolve the configuration
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          manifest_args=()
          while IFS= read -r -d '' arg; do
            manifest_args+=("${arg}")
          done < <(python3 scripts/manifest_substitutions.py "${VARIANT}" --board "${CI_BOARD}" --esphome-args)
          docker run --rm -v "$PWD":/config -w /config --user "$(id -u):$(id -g)" \
            --entrypoint esphome "ghcr.io/esphome/esphome:${ESPHOME_VERSION}" \
            -s version "${VERSION}" "${manifest_args[@]}" config "firmware/${VARIANT}.yaml" > resolved.yaml

      - name: Guard the stamped version, the variant and the board
        run: |
          python3 scripts/check_resolved_config.py resolved.yaml \
            --variant "${{ matrix.variant }}" \
            --board "${CI_BOARD}" \
            --expected-version "${{ steps.stamp.outputs.version }}" \
            --reported-version "${{ steps.build.outputs.project-version }}"
