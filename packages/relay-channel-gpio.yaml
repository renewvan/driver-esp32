# One relay channel on a direct ESP32 GPIO. The twin of relay-channel.yaml (which drives a
# shift register); everything but the `pin` is identical. Included once per channel from
# firmware/esp32-8x-relay.yaml:
#   relay_01: !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_01, nn: "01", gpio: GPIO32 } }
# vars: ch = the channel key inside this firmware (ESPHome ids and the connect-chain table; never on the bus),
# nn = its zero-padded channel number: the bus id is `${board}-${nn}` (renewvan/relay/<board>-<nn>/...), gpio = the relay's ESP32 pin.
#
# This file holds only what is per channel and can be merged by id: the switch, the restoring
# name, and the two subscriptions. It deliberately holds NO on_connect entry: the order of
# separate on_connect entries is undefined, so the eight states are published from the
# `publish_retained_state` script in firmware/esp32-8x-relay.yaml, which is step (1) of the one
# connect chain in base.yaml (states, then info, then online).
#
# `board` comes from the build (flash.sh --board), see packages/base.yaml.
# It needs `mqtt_client` from packages/base.yaml (the firmware includes both).

globals:
  # Retained label, restored across reboot and OTA. 63 bytes by default; the rename handler
  # below enforces the bound itself because an oversize string in a `globals` entry is
  # silently NOT saved and would revert at the next reboot.
  - id: name_${ch}
    type: std::string
    restore_value: true
    initial_value: '""'

switch:
  - platform: gpio
    id: relay_${ch}
    name: "${ch} relay"
    pin: ${gpio}
    # Every channel is off after ANY reset, brownout, update or crash. No state is restored,
    # so a stale "restore last state" can never switch a load back on.
    restore_mode: ALWAYS_OFF
    internal: true
    on_state:
      # State is published only after the physical output changed (it is the device's truth,
      # not an echo of a command).
      - mqtt.publish:
          topic: renewvan/relay/${board}-${nn}/state
          payload: !lambda 'return x ? "true" : "false";'
          retain: true

mqtt:
  on_message:
    # Command: unretained JSON true / false only. No payload filter, so this is one
    # subscription per topic, not one per payload.
    - topic: renewvan/relay/${board}-${nn}/set
      then:
        - lambda: |-
            if (x == "true") {
              id(relay_${ch}).turn_on();
            } else if (x == "false") {
              id(relay_${ch}).turn_off();
            } else {
              ESP_LOGW("relay", "${board}-${nn}: set is not JSON true/false, ignored");
            }
    # Rename: a JSON string on a fixed topic. The trigger hands the action only the raw
    # payload (quotes included), so it is decoded here. on_json_message would lose the value.
    - topic: renewvan/relay/${board}-${nn}/name/set
      then:
        - lambda: |-
            JsonDocument doc;
            if (deserializeJson(doc, x) != DeserializationError::Ok || !doc.is<const char *>()) {
              ESP_LOGW("relay", "${board}-${nn}: name/set is not a JSON string, ignored");
              return;
            }
            std::string v = doc.as<std::string>();
            if (v.empty() || v.size() > 63) {
              ESP_LOGW("relay", "${board}-${nn}: name rejected (empty or over 63 bytes)");
              return;
            }
            id(name_${ch}) = v;
            JsonDocument out;
            out.set(v);
            std::string payload;
            serializeJson(out, payload);
            id(mqtt_client).publish("renewvan/relay/${board}-${nn}/name", payload, 0, true);
