---
# node-relay: 8-channel switched-load relay node.
#
# Per .scratch/renewvan-hub-v0-build/issues/03-esp32-relay-node-config.md
# and the interface decision in
# .scratch/renewvan-hub-v0/issues/03-esp32-relay-node-driver-interface.md:
#
# - No custom firmware — this is the whole node.
# - Each channel: a physical button wired to an ESP32 GPIO input, paired
#   with a relay output on the same GPIO pair, switched by a fully local
#   `on_press` automation (binary_sensor -> switch.toggle). This runs
#   on-device regardless of WiFi/MQTT/broker state — no dependency on
#   the Pi or the van bus for basic switching to work.
# - Every relay is `internal: true` (no Home Assistant/ESPHome-API
#   frontend, no discovery) — its only MQTT presence is the explicit
#   `mqtt.publish` in `on_turn_on`/`on_turn_off` below, which publishes
#   the literal string `"true"`/`"false"` (matching the v0.1 schema's
#   boolean `state` field) retained directly to `renewvan/relay/<id>/state`
#   on every state change.
#
#   NOTE: the ticket 03 decision doc describes this as a `state_topic`
#   + `payload_on`/`payload_off` override on the switch component
#   itself. As of ESPHome's current MQTT Component base config
#   (https://esphome.io/components/mqtt/#mqtt-component-base-configuration),
#   `payload_on`/`payload_off` are not real options there — only
#   `state_topic`/`command_topic` (which still emit ESPHome's native
#   "ON"/"OFF" payloads). Explicit `mqtt.publish` actions are the
#   correct mechanism to get the literal `"true"`/`"false"` payload the
#   schema requires; behavior (retained `renewvan/relay/<id>/state`, "true"/
#   "false" on every change) matches the ticket exactly.
# - No command_topic on the van bus: the relay has no command topic in
#   v0 (read-only dashboard, no tap-to-toggle). ESPHome's own default
#   command topic (outside the `renewvan/` namespace, unused since switches
#   are `internal: true`) is never wired to anything on the van bus.
#
# Channel ids/pins below are the reference wiring for this node; rename
# per channel to match your actual install's load labels — see
# README.md "Customizing channels".

# Static Node fields (node, product, source, publishes, and the optional manufacturer and
# homepage) come ONLY from manifest.json, merged in as substitutions by
# scripts/manifest_substitutions.py; scripts/flash.sh and CI both call it. They are
# deliberately not declared here, so there is one source and a build that skips the
# manifest fails the guard on the unexpanded placeholder instead of publishing a copy.
#
# The optional fields are omitted from the manifest when empty, so they are declared here
# as empty and left out of the published info.
#
# `version` is stamped from the checkout by scripts/flash.sh. KEEP the `dev` default:
# ESPHome only warns on an undeclared substitution and ships the literal "${version}"
# otherwise, so removing it turns a missing build argument into a silent bad version.
substitutions:
  node_name: renewvan-relay
  version: dev
  manufacturer: ""
  homepage: ""

esphome:
  name: ${node_name}
  friendly_name: RenewVan Relay Node
  # Exposes the stamped version as esphome.project.version so the CI build action
  # reports it (`project-version` output) and the guard can compare it.
  project:
    name: renewvan.node-relay
    version: ${version}

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi/OTA/API credentials are install-specific — never committed. Copy
# secrets.yaml.example to secrets.yaml (gitignored) and fill in your
# own values.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for initial/recovery config if the configured network
  # is unreachable.
  ap:
    ssid: "${node_name} Fallback"
    password: !secret wifi_ap_fallback_password

captive_portal:

logger:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key

# The van bus — same Mosquitto every other node publishes to.
# discovery: false: no Home Assistant autodiscovery in the v0 stack.
#
# Node info/health (renewvan/<node>/info, renewvan/<node>/health), see on_connect below:
# - The built-in birth message is disabled (`birth_message:` empty). ESPHome would send
#   it from loop(), after on_connect, so `online` could land before the info.
# - The last-will and shutdown messages publish `offline` on the health topic.
# - on_connect fires on the transport callback, BEFORE the client reports connected,
#   and mqtt.publish silently drops anything sent while not connected. So the handler
#   waits for mqtt.connected, publishes retained info, then retained `online`.
# - Info is republished on every reconnect, so a broker that lost retained state heals.
#   Recorded cost: a publish dropped after the wait leaves the previous retained info
#   (possibly a stale version) until the next reconnect.
mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  birth_message:
  will_message:
    topic: renewvan/${node}/health
    payload: offline
    retain: true
  shutdown_message:
    topic: renewvan/${node}/health
    payload: offline
    retain: true
  on_connect:
    - wait_until:
        mqtt.connected:
    - mqtt.publish:
        topic: renewvan/${node}/info
        retain: true
        payload: !lambda |-
          json::JsonBuilder builder;
          JsonObject root = builder.root();
          root["node"] = "${node}";
          root["product"] = "${product}";
          root["source"] = "${source}";
          // `publishes` is a JSON array literal from manifest.json.
          root["publishes"] = serialized(std::string("${publishes}"));
          if (std::string("${manufacturer}") != "") root["manufacturer"] = "${manufacturer}";
          if (std::string("${homepage}") != "") root["homepage"] = "${homepage}";
          root["version"] = "${version}";
          root["host_serial"] = get_mac_address_pretty();
          return builder.serialize();
    - mqtt.publish:
        topic: renewvan/${node}/health
        payload: online
        retain: true

# --- Channel 1: lights_ceiling -------------------------------------------
switch:
  - platform: gpio
    id: relay_lights_ceiling
    name: "lights_ceiling relay"
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/lights_ceiling/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/lights_ceiling/state, payload: "false", retain: true }

  # --- Channel 2: lights_reading -------------------------------------------
  - platform: gpio
    id: relay_lights_reading
    name: "lights_reading relay"
    pin: GPIO5
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/lights_reading/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/lights_reading/state, payload: "false", retain: true }

  # --- Channel 3: lights_kitchen --------------------------------------------
  - platform: gpio
    id: relay_lights_kitchen
    name: "lights_kitchen relay"
    pin: GPIO13
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/lights_kitchen/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/lights_kitchen/state, payload: "false", retain: true }

  # --- Channel 4: lights_bathroom -------------------------------------------
  - platform: gpio
    id: relay_lights_bathroom
    name: "lights_bathroom relay"
    pin: GPIO16
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/lights_bathroom/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish:
          { topic: renewvan/relay/lights_bathroom/state, payload: "false", retain: true }

  # --- Channel 5: lights_awning ---------------------------------------------
  - platform: gpio
    id: relay_lights_awning
    name: "lights_awning relay"
    pin: GPIO17
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/lights_awning/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/lights_awning/state, payload: "false", retain: true }

  # --- Channel 6: fan_vent ---------------------------------------------------
  - platform: gpio
    id: relay_fan_vent
    name: "fan_vent relay"
    pin: GPIO18
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/fan_vent/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/fan_vent/state, payload: "false", retain: true }

  # --- Channel 7: usb_outlets -------------------------------------------
  - platform: gpio
    id: relay_usb_outlets
    name: "usb_outlets relay"
    pin: GPIO19
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/usb_outlets/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/usb_outlets/state, payload: "false", retain: true }

  # --- Channel 8: aux_1 ------------------------------------------------------
  - platform: gpio
    id: relay_aux_1
    name: "aux_1 relay"
    pin: GPIO23
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - mqtt.publish: { topic: renewvan/relay/aux_1/state, payload: "true", retain: true }
    on_turn_off:
      - mqtt.publish: { topic: renewvan/relay/aux_1/state, payload: "false", retain: true }

# One physical momentary button per channel, wired to GND (internal
# pull-up, inverted). `on_press` toggles the paired relay entirely
# on-device — no network/broker involved, so basic switching keeps
# working even with the Pi/MQTT/WiFi down.
binary_sensor:
  - platform: gpio
    id: button_lights_ceiling
    name: "lights_ceiling button"
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_lights_ceiling

  - platform: gpio
    id: button_lights_reading
    name: "lights_reading button"
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_lights_reading

  - platform: gpio
    id: button_lights_kitchen
    name: "lights_kitchen button"
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_lights_kitchen

  - platform: gpio
    id: button_lights_bathroom
    name: "lights_bathroom button"
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_lights_bathroom

  - platform: gpio
    id: button_lights_awning
    name: "lights_awning button"
    pin:
      number: GPIO25
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_lights_awning

  - platform: gpio
    id: button_fan_vent
    name: "fan_vent button"
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_fan_vent

  - platform: gpio
    id: button_usb_outlets
    name: "usb_outlets button"
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_usb_outlets

  - platform: gpio
    id: button_aux_1
    name: "aux_1 button"
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    internal: true
    on_press:
      then:
        - switch.toggle: relay_aux_1
