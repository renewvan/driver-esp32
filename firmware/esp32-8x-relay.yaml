# driver-esp32 variant esp32-8x-relay: 8-channel switched-load relay driver (LC Technology
# LC-Relay-ESP-8R-D5, ESP32-E, one relay per ESP32 GPIO, no shift register).
#
# Same wire contract and safety rules as esp32-16x-relay (see that file's header and
# docs/adr/0013-writable-relay-and-its-wire-contract.md in renewvan/hub), for channels
# `relay_01` .. `relay_08`:
#   renewvan/relay/<id>/state | name | driver   retained; set and name/set are unretained
# Every channel is OFF after any reset (restore_mode ALWAYS_OFF); relays HOLD their state while
# WiFi or the broker is down; no `api:` and no `web_server:` (the relay contract forbids both).
#
# Pins are from https://devices.esphome.io/devices/esp32e-relay-x8/. UNVERIFIED on the bench:
# relay polarity (these are NOT inverted) and boot glitches. GPIO12 (relay_07) is a strapping
# pin: ESP32 samples it at reset (high selects 1.8 V flash), so the board's driver must hold it
# low; confirm on the bench before connecting any load.
#
# One board per van: the Driver key (`esp32`) and the relay ids are shared with
# esp32-16x-relay, so the two variants must never run on the same bus (README, "What a
# variant is, and the Driver key").
#
# Static Driver fields come ONLY from manifests/esp32-8x-relay.json (see packages/base.yaml).
substitutions:
  variant: esp32-8x-relay
  device_name: renewvan-esp32-8x-relay
  friendly_name: Renewvan ESP32 8x Relay Driver
  fallback_ap_ssid: "Renewvan ESP32 8x Fallback"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Step (1) of the ONE connect chain in packages/base.yaml (states, then Driver info, then
# `online`); see esp32-16x-relay.yaml for why it is a script.
script:
  - id: publish_retained_state
    then:
      # Every channel's retained driver, state, and its retained name when it has one.
      - lambda: |-
          struct Channel { const char *id; switch_::Switch *sw; std::string *name; };
          const Channel channels[] = {
            {"relay_01", id(relay_relay_01), &id(name_relay_01)},
            {"relay_02", id(relay_relay_02), &id(name_relay_02)},
            {"relay_03", id(relay_relay_03), &id(name_relay_03)},
            {"relay_04", id(relay_relay_04), &id(name_relay_04)},
            {"relay_05", id(relay_relay_05), &id(name_relay_05)},
            {"relay_06", id(relay_relay_06), &id(name_relay_06)},
            {"relay_07", id(relay_relay_07), &id(name_relay_07)},
            {"relay_08", id(relay_relay_08), &id(name_relay_08)},
          };
          for (const Channel &c : channels) {
            std::string base = std::string("renewvan/relay/") + c.id;
            // An explicit std::string: a const char* here binds the (topic, payload, length, qos)
            // overload, which sent an empty, unretained payload.
            // The owning Driver, a JSON string, retained with the rest of the instance's identity.
            id(mqtt_client).publish(base + "/driver", std::string("\"${driver}\""), 0, true);
            const std::string state = c.sw->state ? "true" : "false";
            id(mqtt_client).publish(base + "/state", state, 0, true);
            if (!c.name->empty()) {
              JsonDocument doc;
              doc.set(*c.name);
              std::string payload;
              serializeJson(doc, payload);
              id(mqtt_client).publish(base + "/name", payload, 0, true);
            }
          }

# Eight channels, one line each: `ch` is the id on the bus, `gpio` the relay's ESP32 pin.
# The `publish_retained_state` script above lists every `ch`: keep the two in step
# (scripts/check_relay_channels.py fails CI on a mismatch).
packages:
  base: !include ../packages/base.yaml
  relay_01:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_01, gpio: GPIO32 } }
  relay_02:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_02, gpio: GPIO33 } }
  relay_03:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_03, gpio: GPIO25 } }
  relay_04:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_04, gpio: GPIO26 } }
  relay_05:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_05, gpio: GPIO27 } }
  relay_06:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_06, gpio: GPIO14 } }
  relay_07:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_07, gpio: GPIO12 } }
  relay_08:
    !include { file: ../packages/relay-channel-gpio.yaml, vars: { ch: relay_08, gpio: GPIO13 } }
